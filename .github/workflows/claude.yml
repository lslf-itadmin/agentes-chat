# CLAUDE CODE IN LJ'S AGENTES FORK: RESPOND TO @claude IN ISSUES AND PR COMMENTS (WORKS ON ITS OWN claude/... BRANCH; LJ MERGES)
# Setup file only (LSLF, Nov 23, 2026). Modelled on lslf-itadmin/vcoo-a2a's claude.yml. Needs the ANTHROPIC_API_KEY
# secret in this fork. Agentes' own workflows (ci, cla, release-setup and the app builds) are disabled in this fork.
name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
jobs:
  claude:
    if: (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) || (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency: claude-${{ github.event.issue.number || github.event.pull_request.number }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      # Agentes is a Bun project; package.json pins bun@1.4.4 (packageManager).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Diagnostic (LJ, Nov 23): show Claude Code's full output so the API error behind the 1-second failures on
          # issues #4 and #5 is visible. The log is public; remove this line once the cause is found.
          show_full_output: "true"
          # restrict_untrusted_prs stays at its default (on): Codex P1 on PR #1. LJ's Nov 23 "false" applies to vcoo-a2a only.
          claude_args: "--model claude-opus-5-5 --max-turns 200 --allowedTools 'Bash(bun:*),Bash(bunx:*),Bash(docker:*)' --append-system-prompt 'This is the LSLF fork of Agentes. Follow the LSLF rules in AGENTS.md; where they conflict with CLAUDE.md, AGENTS.md wins.'"
